name: Desktop audio failure diagnostics

# Investigation only. Neither short capture nor replay qualifies endurance.
on:
  workflow_call:
    inputs:
      scope:
        type: string
        required: false
        default: all

permissions:
  contents: read
  actions: read

jobs:
  startup:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'startup' }}
    name: Synthetic source startup / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
          - name: macos-intel
            os: macos-15-intel
          - name: macos-arm64
            os: macos-26
    env:
      CI: 'true'
      HUSKY: '0'
      API_BASE_URL: http://localhost:3000
      VITE_API_URL: http://localhost:3000
      SUISSE_E2E_HOOKS: '1'
      SUISSE_TEST_NETWORK_ISOLATION: '1'
      SUISSE_E2E_APP_DIR: dist/electron/UnPackaged
      SUISSE_E2E_BUNDLE_SHA: ${{ github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SENTRY_AUTH_TOKEN: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        timeout-minutes: 10
        run: npm ci
      - name: Prepare bundled media binaries
        timeout-minutes: 2
        run: node scripts/prepare-ffmpeg.js
      - name: Build the isolated unsigned test application
        timeout-minutes: 10
        run: npx quasar build -m electron --skip-pkg
      - name: Measure short capture with small and endurance-size synthetic inputs
        timeout-minutes: 12
        run: node tests/e2e-harness/capture-startup-diagnostic.js
      - name: Preserve diagnostic evidence and captured originals
        if: always()
        timeout-minutes: 7
        uses: actions/upload-artifact@v4
        with:
          name: capture-startup-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e-harness/work/
            !tests/e2e-harness/work/**/*.wav
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

  intel-finalization:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'finalization' }}
    name: Replay preserved Intel native recording
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CI: 'true'
      HUSKY: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SENTRY_AUTH_TOKEN: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        timeout-minutes: 10
        run: npm ci
      # A missing/expired artifact fails visibly; never substitute another run.
      - name: Download the exact generated-audio failure evidence
        timeout-minutes: 10
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 33988551101
          artifact-ids: 9980360723
          merge-multiple: true
          path: ${{ runner.temp }}/suisse-endurance-source
      - name: Replay production finalization with stage and encoder progress evidence
        timeout-minutes: 55
        run: node tests/e2e-harness/finalization-replay.js --artifact-dir "${{ runner.temp }}/suisse-endurance-source"
      - name: Preserve replay results
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: intel-finalization-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/e2e-harness/work/finalization-replay/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1
