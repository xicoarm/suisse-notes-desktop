name: iOS Submit to App Store

# Creates the App Store version, attaches an already-uploaded TestFlight build,
# sets the release notes and submits for review — using the App Store Connect
# API credentials that already live in this repo's secrets. No browser needed.
#
# It never touches the store listing (name, descriptions, screenshots, pricing).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version, must match MARKETING_VERSION (e.g. 3.9.36)'
        required: true
        type: string
      build:
        description: 'CFBundleVersion of the TestFlight build (e.g. 2609021248) - not needed with status'
        required: false
        default: ''
        type: string
      submit:
        description: 'Actually submit for review (unchecked = prepare only)'
        required: true
        default: false
        type: boolean
      status:
        description: 'Only read and print the state of that version (changes nothing)'
        required: false
        default: false
        type: boolean
      withdraw:
        description: 'Withdraw that version from review (it becomes editable again)'
        required: false
        default: false
        type: boolean


# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Withdraw the version from review
        if: ${{ inputs.withdraw }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          [[ "$IN_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::invalid version"; exit 1; }
          node scripts/asc-submit.js --app 6758680707 --version "$IN_VERSION" --withdraw

      - name: Read the state of the version (changes nothing)
        if: ${{ inputs.status }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          [[ "$IN_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::invalid version"; exit 1; }
          node scripts/asc-submit.js --app 6758680707 --version "$IN_VERSION" --status

      - name: Write release notes
        if: ${{ !inputs.status && !inputs.withdraw }}
        run: |
          cat > /tmp/release-notes.txt <<'NOTES'
          Mehr Sicherheit bei der Anmeldung:
          - Ist für Ihr Konto die Zwei-Faktor-Authentifizierung aktiv, fragt die App nach dem Passwort nach dem Code aus Ihrer Authenticator-App, dem Code per E-Mail oder einem Backup-Code.
          NOTES
          cat /tmp/release-notes.txt

      - name: Create version, attach build, submit
        if: ${{ !inputs.status && !inputs.withdraw }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          ASC_DEMO_USER: ${{ secrets.ASC_DEMO_USER }}
          ASC_DEMO_PASS: ${{ secrets.ASC_DEMO_PASS }}
          # Inputs reach the shell only as quoted variables, validated first.
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD: ${{ inputs.build }}
          IN_SUBMIT: ${{ inputs.submit }}
        run: |
          set -euo pipefail
          [[ "$IN_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::invalid version"; exit 1; }
          [[ -z "$IN_BUILD" || "$IN_BUILD" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::invalid build"; exit 1; }
          set -- --app 6758680707 --version "$IN_VERSION" --build "$IN_BUILD" --notes-file /tmp/release-notes.txt
          if [ "$IN_SUBMIT" = "true" ]; then set -- "$@" --submit; fi
          node scripts/asc-submit.js "$@"
