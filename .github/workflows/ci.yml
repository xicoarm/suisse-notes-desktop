name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        # Real fsync and FFmpeg tests share the runner's disk. Avoid competing
        # test files exhausting an unrelated persistence test's time budget.
        run: npm run test -- --maxWorkers=1 --minWorkers=1

  build-validation:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: always()

    steps:
      - name: Require successful lint and tests
        if: needs.lint-and-test.result != 'success'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build validation (SPA mode)
        run: npx quasar build
        env:
          NODE_ENV: production
