name: Release

# Triggered when a version tag is pushed (via standard-version: npm run release)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # =============================================================================
  # Windows Build - electron-builder auto-publishes to GitHub Releases
  # =============================================================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # FFmpeg/ffprobe binaries are stored in Git LFS (see .gitattributes).
          # Without this, the checkout gets 133-byte pointer stubs and the app
          # ships unrunnable ffmpeg.exe to every user (Sentry 649c925f, 4.1.4).
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify FFmpeg binaries are real (not LFS pointers)
        shell: pwsh
        run: |
          $bins = @(
            "resources/ffmpeg/win-x64/ffmpeg.exe",
            "resources/ffmpeg/win-x64/ffprobe.exe"
          )
          foreach ($bin in $bins) {
            if (-not (Test-Path $bin)) {
              Write-Error "FATAL: $bin missing — LFS checkout failed?"
              exit 1
            }
            $size = (Get-Item $bin).Length
            if ($size -lt 1MB) {
              Write-Error "FATAL: $bin is $size bytes (looks like an LFS pointer stub). Expected real binary > 1MB. Confirm 'lfs: true' on checkout and that LFS bandwidth quota is not exhausted."
              exit 1
            }
            Write-Host "$bin OK ($size bytes)"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: npx quasar build -m electron -P never

      - name: Find installer exe
        id: find-exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist/electron/Packaged -Filter "*.exe" | Select-Object -First 1
          echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "Found installer: $($exe.Name)"

      - name: Sign Windows installer with SSL.com eSigner
        uses: sslcom/esigner-codesign@main
        with:
          command: sign
          username: ${{ secrets.SSL_COM_USERNAME }}
          password: ${{ secrets.SSL_COM_PASSWORD }}
          credential_id: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSL_COM_TOTP_SECRET }}
          file_path: ${{ steps.find-exe.outputs.EXE_PATH }}
          override: true
          environment_name: PROD

      - name: Update latest.yml after signing
        shell: pwsh
        run: |
          $exePath = "${{ steps.find-exe.outputs.EXE_PATH }}"
          $ymlPath = "dist/electron/Packaged/latest.yml"
          $exeName = (Get-Item $exePath).Name

          # Recalculate sha512 and size after signing changed the file
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA512).Hash
          $base64Hash = [Convert]::ToBase64String([byte[]] -split ($hash -replace '..', '0x$& '))
          $size = (Get-Item $exePath).Length

          echo "Signed exe: $exeName"
          echo "New SHA512: $base64Hash"
          echo "New size: $size"

          # Update latest.yml with new hash, size, and fix filename (dots vs dashes)
          $content = Get-Content $ymlPath -Raw
          $content = $content -replace '(?<=sha512: )\S+', $base64Hash
          $content = $content -replace '(?<=size: )\d+', $size
          # Fix electron-builder bug: filenames use dots but yml references dashes
          $content = $content -replace 'Suisse-Notes-Setup-', 'Suisse.Notes.Setup.'
          Set-Content -Path $ymlPath -Value $content -NoNewline

          echo "=== Updated latest.yml ==="
          Get-Content $ymlPath

      - name: Verify auto-update files exist
        shell: pwsh
        run: |
          $yml = "dist/electron/Packaged/latest.yml"
          if (-not (Test-Path $yml)) {
            Write-Error "FATAL: $yml not found! Auto-update will be broken for Windows users."
            exit 1
          }
          $content = Get-Content $yml -Raw
          if ($content -notmatch "version:" -or $content -notmatch "sha512:") {
            Write-Error "FATAL: $yml is malformed! Missing version or sha512."
            exit 1
          }
          Write-Host "latest.yml OK:"
          Write-Host $content

      - name: Upload Windows artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/electron/Packaged/*.exe
            dist/electron/Packaged/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  # =============================================================================
  # macOS Build - sign, notarize, then upload to release
  # =============================================================================
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # FFmpeg/ffprobe binaries are stored in Git LFS (see .gitattributes).
          # Without this, the checkout gets 133-byte pointer stubs and the app
          # ships unrunnable Mach-O files to every user (Sentry 87c5526a +
          # ec5d511f on 4.1.2/4.1.3, 649c925f on 4.1.4 Windows).
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify FFmpeg binaries are real (not LFS pointers)
        run: |
          set -e
          for bin in resources/ffmpeg/mac-arm64/ffmpeg \
                     resources/ffmpeg/mac-arm64/ffprobe \
                     resources/ffmpeg/mac-x64/ffmpeg \
                     resources/ffmpeg/mac-x64/ffprobe; do
            if [ ! -f "$bin" ]; then
              echo "FATAL: $bin missing — LFS checkout failed?"
              exit 1
            fi
            size=$(stat -f%z "$bin")
            if [ "$size" -lt 1048576 ]; then
              echo "FATAL: $bin is $size bytes (looks like an LFS pointer stub). Expected real binary > 1MB. Confirm 'lfs: true' on checkout and that LFS bandwidth quota is not exhausted."
              exit 1
            fi
            # Confirm it parses as Mach-O for the right arch.
            file "$bin" | grep -q 'Mach-O' || { echo "FATAL: $bin is not a Mach-O binary"; file "$bin"; exit 1; }
            echo "$bin OK ($size bytes)"
          done

      - name: Install dependencies
        run: npm ci

      - name: Import code signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "ERROR: CSC_LINK is empty!"
            exit 1
          fi

          # Decode and import certificate
          echo "$CSC_LINK" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import certificate.p12 -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "Installed certificates:"
          security find-identity -v "$KEYCHAIN_PATH"

          rm certificate.p12

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> $GITHUB_ENV

          # Write API key for notarization
          API_KEY_DIR="$HOME/private_keys"
          mkdir -p "$API_KEY_DIR"
          echo "$API_KEY_CONTENT" > "$API_KEY_DIR/AuthKey_${API_KEY_ID}.p8"
          echo "APPLE_API_KEY_PATH=$API_KEY_DIR/AuthKey_${API_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Sign FFmpeg and ffprobe binaries
        run: |
          set -e
          echo "=== Signing FFmpeg/ffprobe binaries with Developer ID ==="
          IDENTITY=$(security find-identity -v -p codesigning "$CSC_KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using identity: $IDENTITY"

          # Sign every binary that ships in Contents/Resources/ffmpeg for both
          # macOS architectures. extraResources in quasar.config.js maps
          # `resources/ffmpeg/${os}-${arch}/` → `Contents/Resources/ffmpeg/`,
          # so the per-arch DMG picks the right pre-signed binary.
          # Previous workflow signed `resources/ffmpeg/darwin/ffmpeg`, a path
          # that nothing references — and never signed ffprobe at all.
          for binary in resources/ffmpeg/mac-arm64/ffmpeg \
                        resources/ffmpeg/mac-arm64/ffprobe \
                        resources/ffmpeg/mac-x64/ffmpeg \
                        resources/ffmpeg/mac-x64/ffprobe; do
            echo "Signing $binary"
            codesign --sign "$IDENTITY" \
              --keychain "$CSC_KEYCHAIN" \
              --options runtime \
              --timestamp \
              --force \
              "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done
          echo "=== FFmpeg/ffprobe signed successfully ==="

      - name: Sign AudioTee binary
        run: |
          echo "=== Signing AudioTee binary with Developer ID ==="
          IDENTITY=$(security find-identity -v -p codesigning "$CSC_KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Using identity: $IDENTITY"

          codesign --sign "$IDENTITY" \
            --keychain "$CSC_KEYCHAIN" \
            --options runtime \
            --entitlements build/entitlements.mac.plist \
            --timestamp \
            --force \
            resources/audiotee/audiotee

          echo "Verifying AudioTee signature..."
          codesign --verify --deep --strict --verbose=2 resources/audiotee/audiotee
          echo "=== AudioTee signed successfully ==="

      - name: Build Electron app for macOS
        env:
          # GH_TOKEN is needed by electron-builder to resolve GitHub publish provider
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # -P never: generate latest-mac.yml but don't upload artifacts
          # We upload manually after notarization via action-gh-release
          npx quasar build -m electron -P never

      - name: Align latest-mac.yml with actual filenames
        run: |
          cd dist/electron/Packaged
          echo "=== Files ==="
          ls -1
          echo "=== latest-mac.yml (before) ==="
          cat latest-mac.yml

          # electron-builder bug (#2706): productName "Suisse Notes" creates files
          # with dots (Suisse.Notes-) but latest-mac.yml references dashes (Suisse-Notes-).
          # Fix: unconditionally replace dashes with dots in latest-mac.yml to match files.
          # This is safe because the actual files ALWAYS use dots on our builds.
          sed -i '' 's/Suisse-Notes-/Suisse.Notes-/g' latest-mac.yml

          echo "=== latest-mac.yml (after) ==="
          cat latest-mac.yml

      - name: Verify auto-update files exist
        run: |
          echo "=== Checking latest-mac.yml ==="
          if [ ! -f dist/electron/Packaged/latest-mac.yml ]; then
            echo "FATAL: latest-mac.yml not found! Auto-update will be broken for macOS users."
            echo "This usually means the publish config in quasar.config.js was removed or -P never was not passed."
            exit 1
          fi
          if ! grep -q "version:" dist/electron/Packaged/latest-mac.yml || ! grep -q "sha512:" dist/electron/Packaged/latest-mac.yml; then
            echo "FATAL: latest-mac.yml is malformed! Missing version or sha512."
            exit 1
          fi
          echo "latest-mac.yml OK:"
          cat dist/electron/Packaged/latest-mac.yml
          echo ""
          echo "=== Checking zip files for auto-update ==="
          ZIP_COUNT=$(find dist/electron/Packaged -name "*.zip" | wc -l)
          if [ "$ZIP_COUNT" -lt 2 ]; then
            echo "FATAL: Expected at least 2 zip files (x64 + arm64), found $ZIP_COUNT"
            exit 1
          fi
          echo "Found $ZIP_COUNT zip files - OK"

      - name: Verify code signing
        run: |
          echo "=== Verifying code signing ==="
          APP_PATH=$(find dist/electron/Packaged -name "*.app" -maxdepth 2 | head -1)
          echo "Checking app: $APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo ""
          echo "=== Gatekeeper assessment ==="
          spctl --assess --type exec --verbose "$APP_PATH" || true
          echo ""
          echo "=== Signing identity ==="
          codesign -dvv "$APP_PATH" 2>&1 | head -20
          echo "=== Code signing OK ==="

      - name: Notarize macOS app
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        timeout-minutes: 45
        run: |
          NOTARY_ARGS="--key $APPLE_API_KEY_PATH --key-id $API_KEY_ID --issuer $API_ISSUER_ID"

          echo "=== Notarizing macOS DMG files ==="
          for dmg in dist/electron/Packaged/*.dmg; do
            echo "========================================="
            echo "Submitting $dmg for notarization..."
            echo "========================================="

            # Submit and wait (up to 40 min)
            xcrun notarytool submit "$dmg" $NOTARY_ARGS --wait --timeout 40m 2>&1 | tee /tmp/notary-output.txt || true

            # Extract submission ID
            SUB_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/notary-output.txt | head -1)
            echo "Submission ID: $SUB_ID"

            # Always fetch the log from Apple (shows exact rejection reason if any)
            if [ -n "$SUB_ID" ]; then
              echo ""
              echo "=== Apple notarization log ==="
              xcrun notarytool log "$SUB_ID" $NOTARY_ARGS /tmp/notary-log.json 2>&1 || true
              cat /tmp/notary-log.json 2>/dev/null || echo "(no log available yet)"
              echo ""
            fi

            # Check if it was accepted
            if grep -q "status: Accepted" /tmp/notary-output.txt; then
              echo "Notarization ACCEPTED for $dmg"
              echo "Stapling notarization ticket..."
              xcrun stapler staple "$dmg"
            elif grep -q "status: Invalid" /tmp/notary-output.txt; then
              echo "ERROR: Notarization REJECTED for $dmg"
              echo "Check the Apple log above for details"
              exit 1
            else
              echo "WARNING: Notarization status unknown (may have timed out)"
              echo "Check submission $SUB_ID manually"
              exit 1
            fi
          done
          echo "=== All DMGs notarized and stapled ==="

      - name: Upload macOS artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/electron/Packaged/*.dmg
            dist/electron/Packaged/*.dmg.blockmap
            dist/electron/Packaged/*.zip
            dist/electron/Packaged/*.zip.blockmap
            dist/electron/Packaged/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify release has auto-update files
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Verifying GitHub Release assets ==="
          TAG="${{ github.ref_name }}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Release assets:"
          echo "$ASSETS"
          echo ""
          if ! echo "$ASSETS" | grep -q "latest-mac.yml"; then
            echo "FATAL: latest-mac.yml is missing from GitHub Release $TAG!"
            echo "macOS auto-update will NOT work. Investigate and re-upload."
            exit 1
          fi
          echo "latest-mac.yml present in release - auto-update OK"
