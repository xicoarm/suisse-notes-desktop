name: Mobile Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-capacitor/**'
      - 'quasar.config.js'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios

jobs:
  # =============================================================================
  # Check if mobile release should run
  # =============================================================================
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if mobile build is needed
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Always run on manual trigger (workflow_dispatch)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger — always run"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Use first line only for pattern matching (multi-line messages break [[ ]])
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          # Skip release version bumps (desktop-only) and [skip ci] commits
          if [[ "$FIRST_LINE" == *"[skip ci]"* ]] || [[ "$FIRST_LINE" == chore\(release\):* ]]; then
            echo "Skipping: commit is a release bump or has [skip ci]"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  # =============================================================================
  # Android Build & Deploy to Play Store
  # =============================================================================
  android:
    needs: check
    if: |
      needs.check.outputs.should_run == 'true' &&
      (github.event_name == 'push' || github.event.inputs.platform == 'both' || github.event.inputs.platform == 'android')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: src-capacitor/android

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets for Capacitor
        run: npx quasar build -m capacitor -T android --skip-pkg
        env:
          NODE_ENV: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Sync Capacitor
        run: npm run cap:sync

      - name: Make gradlew executable
        run: chmod +x src-capacitor/android/gradlew

      - name: Decode Android keystore
        if: env.ANDROID_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$ANDROID_KEYSTORE" | tr -d '\n\r ' | base64 -d > src-capacitor/android/app/release.keystore
          echo "Keystore size: $(wc -c < src-capacitor/android/app/release.keystore) bytes"
          file src-capacitor/android/app/release.keystore

      - name: Create keystore.properties
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > src-capacitor/android/keystore.properties
          cat src-capacitor/android/keystore.properties | sed 's/=.*/=***/'

      - name: Install Fastlane dependencies
        working-directory: src-capacitor/android
        run: bundle install

      - name: Deploy to Play Store (Internal)
        if: env.PLAY_STORE_JSON_KEY != ''
        working-directory: src-capacitor/android
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          echo "$PLAY_STORE_JSON_KEY" > play-store-key.json
          bundle exec fastlane internal
          rm play-store-key.json

      - name: Build AAB and APK (without Play Store deploy)
        if: env.PLAY_STORE_JSON_KEY == ''
        working-directory: src-capacitor/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            src-capacitor/android/app/build/outputs/apk/**/*.apk
            src-capacitor/android/app/build/outputs/bundle/**/*.aab

  # =============================================================================
  # iOS Build & Deploy to TestFlight
  # =============================================================================
  ios:
    needs: check
    if: |
      needs.check.outputs.should_run == 'true' &&
      (github.event_name == 'push' || github.event.inputs.platform == 'both' || github.event.inputs.platform == 'ios')
    # macos-26: required for Xcode 26 + iOS 26 SDK. Apple began rejecting
    # uploads built with older SDKs in May 2026, which is why macos-latest
    # (still resolving to macos-15 / Xcode 16) was failing at upload_to_testflight.
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: src-capacitor/ios/App

      - name: Install npm dependencies
        run: npm ci

      - name: Install Capacitor dependencies
        run: cd src-capacitor && npm ci

      - name: Patch BLE plugin for SPM compatibility
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = 'src-capacitor/node_modules/@capacitor-community/bluetooth-le';
            // 1. Separate ObjC files (SPM doesn't support mixed-language targets)
            const objcDir = path.join(dir, 'ios', 'PluginObjC');
            fs.mkdirSync(objcDir, { recursive: true });
            for (const f of ['Plugin.m', 'Plugin.h']) {
              const src = path.join(dir, 'ios', 'Plugin', f);
              const dst = path.join(objcDir, f);
              if (fs.existsSync(src)) { fs.copyFileSync(src, dst); fs.unlinkSync(src); console.log('Moved', f, 'to PluginObjC/'); }
            }
            const plist = path.join(dir, 'ios', 'Plugin', 'Info.plist');
            if (fs.existsSync(plist)) fs.unlinkSync(plist);
            // 2. Add missing UIKit import to all Swift files
            const pluginDir = path.join(dir, 'ios', 'Plugin');
            for (const file of fs.readdirSync(pluginDir)) {
              if (!file.endsWith('.swift')) continue;
              const fp = path.join(pluginDir, file);
              let content = fs.readFileSync(fp, 'utf8');
              if (!content.includes('import UIKit')) {
                content = 'import UIKit' + String.fromCharCode(10) + content;
                fs.writeFileSync(fp, content);
                console.log('Added import UIKit to', file);
              }
            }
            // 3. Verify
            const dm = fs.readFileSync(path.join(pluginDir, 'DeviceManager.swift'), 'utf8');
            console.log('DeviceManager.swift first line:', dm.split(String.fromCharCode(10))[0]);
            // 4. Create Package.swift
            const pkg = [
              '// swift-tools-version: 5.9',
              'import PackageDescription',
              '',
              'let package = Package(',
              '    name: \"CapacitorCommunityBluetoothLe\",',
              '    platforms: [.iOS(.v13)],',
              '    products: [',
              '        .library(name: \"CapacitorCommunityBluetoothLe\", targets: [\"BluetoothLePlugin\", \"BluetoothLePluginObjC\"])',
              '    ],',
              '    dependencies: [',
              '        .package(url: \"https://github.com/ionic-team/capacitor-swift-pm.git\", from: \"6.0.0\")',
              '    ],',
              '    targets: [',
              '        .target(',
              '            name: \"BluetoothLePluginObjC\",',
              '            dependencies: [',
              '                .product(name: \"Capacitor\", package: \"capacitor-swift-pm\"),',
              '                .product(name: \"Cordova\", package: \"capacitor-swift-pm\")',
              '            ],',
              '            path: \"ios/PluginObjC\",',
              '            publicHeadersPath: \".\"),',
              '        .target(',
              '            name: \"BluetoothLePlugin\",',
              '            dependencies: [',
              '                .product(name: \"Capacitor\", package: \"capacitor-swift-pm\"),',
              '                .product(name: \"Cordova\", package: \"capacitor-swift-pm\")',
              '            ],',
              '            path: \"ios/Plugin\")',
              '    ]',
              ')',
            ].join(String.fromCharCode(10));
            fs.writeFileSync(dir + '/Package.swift', pkg);
            console.log('Package.swift created');
          "

      - name: Build web assets for Capacitor
        run: npx quasar build -m capacitor -T ios --skip-pkg
        env:
          NODE_ENV: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Sync Capacitor
        run: npm run cap:sync

      - name: Register local iOS plugins
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-capacitor/ios/App/App/capacitor.config.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (!c.packageClassList) c.packageClassList = [];
            if (!c.packageClassList.includes('BackgroundRecordingPlugin')) {
              c.packageClassList.push('BackgroundRecordingPlugin');
              fs.writeFileSync(p, JSON.stringify(c, null, '\t'));
              console.log('Added BackgroundRecordingPlugin to packageClassList');
            }
          "

      # Note: This project uses Swift Package Manager (SPM), not CocoaPods

      - name: Install Fastlane dependencies
        working-directory: src-capacitor/ios/App
        run: bundle install

      - name: Setup App Store Connect API Key
        if: env.APP_STORE_CONNECT_API_KEY_ID != ''
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8

      - name: Deploy to TestFlight
        if: env.APP_STORE_CONNECT_API_KEY_ID != ''
        working-directory: src-capacitor/ios/App
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane beta

      - name: Build IPA (without TestFlight deploy)
        if: env.APP_STORE_CONNECT_API_KEY_ID == ''
        working-directory: src-capacitor/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload dSYMs to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          npx @sentry/cli debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            src-capacitor/ios/App/build/ || echo "dSYM upload failed (non-blocking)"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            src-capacitor/ios/App/build/**/*.ipa
            src-capacitor/ios/App/build/**/*.xcarchive
