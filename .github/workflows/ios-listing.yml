name: iOS Store Texts

# Sets subtitle, description, keywords, promotional text and "what's new" per
# language (from a JSON file in the dispatched ref) on an editable App Store
# version; creates missing languages. Run with dry_run first.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 3.9.42); must be editable'
        required: true
        type: string
      texts:
        description: 'JSON file in this ref: { "de-DE": { subtitle, promotionalText, keywords, description, whatsNew }, ... }'
        required: true
        type: string
      copyright:
        description: 'Copyright line (optional, e.g. © 2026 Suisse IT GmbH)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Only print what would change'
        required: true
        default: true
        type: boolean


# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set the store texts
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          COPYRIGHT: ${{ inputs.copyright }}
          # Inputs reach the shell only as quoted variables, validated first
          # (never interpolated into the script: no command injection).
          IN_VERSION: ${{ inputs.version }}
          IN_TEXTS: ${{ inputs.texts }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "$IN_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::invalid version"; exit 1; }
          [[ "$IN_TEXTS" =~ ^[A-Za-z0-9._/-]+\.json$ && "$IN_TEXTS" != *..* && "$IN_TEXTS" != /* ]] || { echo "::error::invalid texts path"; exit 1; }
          set -- --app 6758680707 --version "$IN_VERSION" --texts "$IN_TEXTS"
          if [ -n "$COPYRIGHT" ]; then set -- "$@" --copyright "$COPYRIGHT"; fi
          if [ "$IN_DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          node scripts/asc-listing.js "$@"
