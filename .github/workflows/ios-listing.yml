name: iOS Store Texts

# Sets subtitle, description, keywords, promotional text and "what's new" per
# language (from a JSON file in the dispatched ref) on an editable App Store
# version; creates missing languages. Run with dry_run first.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 3.9.42); must be editable'
        required: true
        type: string
      texts:
        description: 'JSON file in this ref: { "de-DE": { subtitle, promotionalText, keywords, description, whatsNew }, ... }'
        required: true
        type: string
      copyright:
        description: 'Copyright line (optional, e.g. © 2026 Suisse IT GmbH)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Only print what would change'
        required: true
        default: true
        type: boolean

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set the store texts
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          COPYRIGHT: ${{ inputs.copyright }}
        run: |
          set -- --app 6758680707 --version "${{ inputs.version }}" --texts "${{ inputs.texts }}"
          if [ -n "$COPYRIGHT" ]; then set -- "$@" --copyright "$COPYRIGHT"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then set -- "$@" --dry-run; fi
          node scripts/asc-listing.js "$@"
