name: Release gate start check (temporary)

# Temporary: proves that a tag-like caller with release.yml's permissions can start
# audio-reliability.yml as a reusable workflow. Removed again before merging.
on:
  push:
    branches: [fix/release-qualify-permissions]

permissions:
  contents: write

jobs:
  qualify:
    name: Qualify audio before release
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/audio-reliability.yml
